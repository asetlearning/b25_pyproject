#
# Sample PatternBoost workflow config. All fields optional with sensible
# defaults — see algorithms/pattern_boost/workflow.py for the dataclass schema.

output_dir: output/pattern_boost
seed: 12345

relators:
  max_relator_len: 5
  num_generators: 2
#  standard_generator_tokens: ["a", "b"]  # token strings for standard generators; requires use_compression=true

challenges:
#  path: data/pattern_boost_experiments/relator_sets/relators_shortlex_rules_2.5reduced_1.json
  path: data/pattern_boost_experiments/relator_sets/relators_sample_n1000_20260519_131825.json
  sample_size: 1

tokenizer:
  use_bpe: false   # enable BPE merges on top of structured tokens
  vocab_size: 512  # only used when use_bpe is true

model:
  n_layer: 6
  n_head: 8
  n_embd: 256
  n_positions: 512

training:
  batch_size: 16
  epochs: 10
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 100

initial_sampling:
  n_initial: 50000
  min_factors: 3
  max_factors: 10
  min_expanded_len: 5
  conj_len_max: 4

generation:
  n_samples: 1200
  max_length: 512
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  batch_size: 16

local_search:
  beam_width: 1 # 1 = greedy
  max_steps: 10 # 3
  num_conj_samples: 5 # random conjugator mutations per factor per step (Random strat only)
  num_insert_samples: 5 # random factor insertions per step
  conj_max_len: 4 # max conjugator length for mutations/insertions (Random strat only)
  min_factors: 1 # don't delete below this
  max_factors: 10 # don't insert above this'
  conj_move_strategy: deterministic  # deterministic | random

scoring:
  type: hybrid  # hellinger | hamming | edit | word_product_length | abelianized_product_length | high_power_count | length_range | hybrid
  reduce2_5: false  # apply greedy 2.5 reduction to word before scoring
  penalize_trivial: false  # score 0.0 for words that reduce to the identity
  # For hybrid type, uncomment and populate components:
  components:
     - {type: edit, weight: 1.0}
     - {type: abelianized_product_length, weight: 0.5, params: {q: 5}}
#     - {type: high_power_count, weight: 0.5, params: {threshold: 2.5}}
#     - {type: length_range, weight: 0.5, params: {min_length: 20, max_length: 80, sigma: 10}}

workflow:
  num_iterations: 20
  top_k: 1000
  max_pool_size: 1000
  parallel_workers: 12
  save_every: -1
  train_from_scratch: false  # rebuild model with fresh weights each iter

logging:
  level: info
  log_file: null  # null -> output_dir/run.jsonl

compression:
  use_compression: false
  compression_tokenizer: models/tokenizer/compression_bpe_sample_n1000_20260519_131825_relator_R426.json
#  models/tokenizer/compression_bpe_sample_n1000_20260519_131825.json  # path to BPETokenizerWordCompression model JSON
