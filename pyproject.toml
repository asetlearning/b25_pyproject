[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b25_pyproject"
version = "0.1.0"
description = "Burnside Problem B(2,5) experimentation tools"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0",
    "tqdm>=4.0",
]

[tool.setuptools.packages.find]
include = ["algorithms*", "data*", "experiments*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
