[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "b25_pyproject"
version = "0.1.0"
description = "Burnside Problem B(2,5) experimentation tools"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0",
    "tqdm>=4.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["algorithms", "data", "experiments", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
