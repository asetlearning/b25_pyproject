[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "b25_pyproject"
version = "0.1.0"
description = "Burnside Problem B(2,5) experimentation tools"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.0",
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.20",
    "pyyaml>=6.0",
    "typer>=0.12",
    "marimo>=0.9",
    "pandas>=2.0",
    "plotly>=5.0",
]

[dependency-groups]
dev = ["pytest>=7.0"]
build = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
    "cmake",
    "ninja",
]

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = ".cmake_build/{wheel_tag}"
wheel.packages = ["algorithms", "data", "experiments", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
